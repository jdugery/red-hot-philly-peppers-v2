media:
  input: public/images
  output: /images

content:
  - name: peppers
    label: Pepper Varieties
    type: collection
    path: src/content/peppers
    filename: "{primary}.md"

    view:
      fields:
        - name
        - species
        - heat
        - showOnWebsite
        - available

    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: species
        label: Species
        type: string
        required: true

      - name: heat
        label: Heat
        type: string
        required: true

      - name: color
        label: Color
        type: string

      - name: description
        label: Short Description
        type: text
        required: true

      - name: image
        label: Main Photo
        type: image

      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image

          - name: caption
            label: Caption
            type: string

      - name: available
        label: Available
        type: boolean
        default: false

      - name: showOnWebsite
        label: Show on Website
        type: boolean
        default: true

      - name: seedPrice
        label: Seed Price
        type: number

      - name: seedQuantity
        label: Seeds Per Pack
        type: string

      - name: purchaseUrl
        label: Purchase Link
        type: string
      
      - name: isolatedAvailable
        label: Isolated Seeds Available
        type: boolean
        default: false

      - name: isolatedPrice
        label: Isolated Seed Upgrade Price
        type: number

  - name: tomatoes
    label: Tomato Varieties
    type: collection
    path: src/content/tomatoes
    format: yaml-frontmatter
    filename: "{primary}.md"

    fields:
    - name: name
      label: Name
      type: string

    - name: species
      label: Species
      type: string

    - name: type
      label: Type
      type: string

    - name: color
      label: Color
      type: string

    - name: description
      label: Description
      type: text

    - name: image
      label: Main Image
      type: image

    - name: gallery
      label: Gallery
      type: object
      list: true
      fields:
        - name: image
          label: Image
          type: image

        - name: caption
          label: Caption
          type: string

    - name: available
      label: Seeds Available
      type: boolean
      default: false

    - name: showOnWebsite
      label: Show on Website
      type: boolean
      default: true

    - name: seedPrice
      label: Seed Price
      type: number

    - name: seedQuantity
      label: Seed Quantity
      type: string

    - name: isolatedAvailable
      label: Isolated Seeds Available
      type: boolean
      default: false

    - name: isolatedPrice
      label: Isolated Seed Upgrade Price
      type: number

    - name: purchaseUrl
      label: Purchase URL
      type: string

  - name: tobacco
    label: Tobacco Varieties
    type: collection
    path: src/content/tobacco
    format: yaml-frontmatter
    filename: "{primary}.md"

    fields:
    - name: name
      label: Name
      type: string

    - name: species
      label: Species
      type: string

    - name: type
      label: Type
      type: string

    - name: description
      label: Description
      type: text

    - name: image
      label: Main Image
      type: image

    - name: gallery
      label: Gallery
      type: object
      list: true
      fields:
        - name: image
          label: Image
          type: image

        - name: caption
          label: Caption
          type: string

    - name: available
      label: Seeds Available
      type: boolean
      default: false

    - name: showOnWebsite
      label: Show on Website
      type: boolean
      default: true

    - name: seedPrice
      label: Seed Price
      type: number

    - name: seedQuantity
      label: Seed Quantity
      type: string

    - name: isolatedAvailable
      label: Isolated Seeds Available
      type: boolean
      default: false

    - name: isolatedPrice
      label: Isolated Seed Upgrade Price
      type: number

    - name: purchaseUrl
      label: Purchase URL
      type: string
